# ============================================================
# docker-compose.yml
# Local development: run API + UI together with one command
# Usage: docker-compose up --build
# ============================================================

services:

  # ----------------------------------------------------------
  # API – FastAPI backend
  # ----------------------------------------------------------
  api:
    build:
      # The application source is cloned from Bitbucket into api-src/.
      context: ./api-src
      dockerfile: Dockerfile
    image: api-app:latest
    container_name: devops_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING:-mysql+pymysql://root:password@db:3306/testdb}
      - DEBUG=${DEBUG:-false}
    depends_on:
      db:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - app-network

  # ----------------------------------------------------------
  # UI – Next.js frontend
  # ----------------------------------------------------------
  ui:
    build:
      # The application source is cloned from Bitbucket into ui-src/.
      context: ./ui-src
      dockerfile: Dockerfile
    image: ui-app:latest
    container_name: devops_ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # This value is used by browser-side JavaScript, so it must use the
      # published host port rather than the internal Docker service name.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - PORT=3000
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  # ----------------------------------------------------------
  # Database – MySQL required by the cloned FastAPI application
  # ----------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: devops_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=testdb
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    # Not exposed outside the internal network for security
    # ports:
    #   - "5432:5432"

# ----------------------------------------------------------
# Shared network — containers talk to each other by service name
# ----------------------------------------------------------
networks:
  app-network:
    driver: bridge

# ----------------------------------------------------------
# Named volume for PostgreSQL data persistence
# ----------------------------------------------------------
volumes:
  mysql-data:
