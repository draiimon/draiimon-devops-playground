<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Part 4 Kubernetes High Availability Architecture</title>
  <desc id="desc">Domain requests enter an Nginx Ingress, which routes to API and UI ClusterIP Services. Each service distributes traffic to replicas spread across two Minikube nodes. Metrics Server feeds the Horizontal Pod Autoscalers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .heading { font: 700 28px Inter, Arial, sans-serif; fill: #0f172a; }
      .subheading { font: 500 15px Inter, Arial, sans-serif; fill: #475569; }
      .label { font: 700 18px Inter, Arial, sans-serif; fill: #ffffff; }
      .small { font: 500 14px Inter, Arial, sans-serif; fill: #e2e8f0; }
      .dark-label { font: 700 17px Inter, Arial, sans-serif; fill: #0f172a; }
      .dark-small { font: 500 14px Inter, Arial, sans-serif; fill: #334155; }
      .node-title { font: 700 17px Inter, Arial, sans-serif; fill: #1e293b; }
      .node-small { font: 500 13px Inter, Arial, sans-serif; fill: #475569; }
      .pill { font: 700 13px Inter, Arial, sans-serif; fill: #1e293b; }
    </style>
  </defs>

  <rect width="1400" height="860" rx="28" fill="url(#bg)"/>
  <text x="70" y="62" class="heading">Part 4 — Kubernetes High Availability Architecture</text>
  <text x="70" y="91" class="subheading">Minikube two-node runtime • domain routing • replicated workloads • health recovery • autoscaling</text>

  <rect x="70" y="135" width="250" height="112" rx="18" fill="#0f172a" filter="url(#shadow)"/>
  <text x="195" y="171" text-anchor="middle" class="label">Domain Requests</text>
  <text x="195" y="199" text-anchor="middle" class="small">api.myapp.local</text>
  <text x="195" y="221" text-anchor="middle" class="small">ui.myapp.local</text>

  <rect x="440" y="125" width="300" height="132" rx="18" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="590" y="166" text-anchor="middle" class="label">Nginx Ingress</text>
  <text x="590" y="194" text-anchor="middle" class="small">app-ingress • class nginx</text>
  <text x="590" y="220" text-anchor="middle" class="small">host-based routing</text>

  <rect x="870" y="110" width="420" height="164" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="146" class="dark-label">Kubernetes control features</text>
  <text x="900" y="177" class="dark-small">• readiness and liveness probes</text>
  <text x="900" y="202" class="dark-small">• PodDisruptionBudget minAvailable: 1</text>
  <text x="900" y="227" class="dark-small">• RollingUpdate maxUnavailable: 0</text>
  <text x="900" y="252" class="dark-small">• Metrics Server → HPA</text>

  <path d="M 320 191 H 440" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 740 191 H 870" stroke="#94a3b8" stroke-width="3" stroke-dasharray="9 8" fill="none" marker-end="url(#arrow)"/>

  <rect x="78" y="330" width="1244" height="425" rx="24" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="372" class="heading" font-size="23">devops-exam namespace</text>
  <text x="110" y="398" class="subheading">ClusterIP Services provide stable internal endpoints and select only Ready pods</text>

  <rect x="115" y="435" width="260" height="92" rx="16" fill="url(#teal)"/>
  <text x="245" y="472" text-anchor="middle" class="label">api-service</text>
  <text x="245" y="499" text-anchor="middle" class="small">ClusterIP :80 → :8000</text>

  <rect x="115" y="585" width="260" height="92" rx="16" fill="url(#teal)"/>
  <text x="245" y="622" text-anchor="middle" class="label">ui-service</text>
  <text x="245" y="649" text-anchor="middle" class="small">ClusterIP :80 → :3000</text>

  <path d="M 590 257 V 315 H 245 V 435" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 590 257 V 315 H 245 V 585" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="435" y="425" width="400" height="116" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="465" y="460" class="dark-label">API replicas</text>
  <rect x="465" y="480" width="150" height="39" rx="19" fill="#dbeafe"/>
  <text x="540" y="505" text-anchor="middle" class="pill">api-app pod A</text>
  <rect x="645" y="480" width="150" height="39" rx="19" fill="#dbeafe"/>
  <text x="720" y="505" text-anchor="middle" class="pill">api-app pod B</text>

  <rect x="435" y="575" width="400" height="116" rx="16" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="465" y="610" class="dark-label">UI replicas</text>
  <rect x="465" y="630" width="150" height="39" rx="19" fill="#cffafe"/>
  <text x="540" y="655" text-anchor="middle" class="pill">ui-app pod A</text>
  <rect x="645" y="630" width="150" height="39" rx="19" fill="#cffafe"/>
  <text x="720" y="655" text-anchor="middle" class="pill">ui-app pod B</text>

  <path d="M 375 481 H 435" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 375 631 H 435" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="900" y="420" width="365" height="128" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="930" y="456" class="dark-label">minikube node</text>
  <text x="930" y="483" class="dark-small">API pod + UI pod</text>
  <text x="930" y="510" class="dark-small">control-plane • Ready</text>

  <rect x="900" y="588" width="365" height="128" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="930" y="624" class="dark-label">minikube-m02 node</text>
  <text x="930" y="651" class="dark-small">API pod + UI pod</text>
  <text x="930" y="678" class="dark-small">worker • Ready</text>

  <path d="M 835 483 H 900" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#arrow)"/>
  <path d="M 835 641 H 900" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#arrow)"/>

  <rect x="111" y="785" width="1178" height="40" rx="20" fill="#dbeafe"/>
  <text x="700" y="811" text-anchor="middle" class="pill">Evidence: two Ready nodes • multiple endpoints • HPA metrics • domain HTTP 200 • pod replacement recovery</text>
</svg>