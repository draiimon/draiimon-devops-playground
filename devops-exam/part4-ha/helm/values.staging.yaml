# ============================================================
# values.staging.yaml — staging environment overrides
# Usage: helm upgrade myapp ./helm -f values.yaml -f values.staging.yaml
# ============================================================

api:
  replicaCount: 2
  env:
    DEBUG: "false"
    LOG_LEVEL: "info"
  autoscaling:
    maxReplicas: 4

ui:
  replicaCount: 2
  autoscaling:
    maxReplicas: 3

ingress:
  hosts:
    api: api.myapp.local
    ui: ui.myapp.local
