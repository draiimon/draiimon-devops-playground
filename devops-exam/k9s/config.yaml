# ============================================================
# k9s config — place at: ~/.config/k9s/config.yaml
# (Ubuntu: ~/.config/k9s/config.yaml)
# ============================================================
k9s:
  liveViewAutoRefresh: true
  refreshRate: 2             # Refresh every 2 seconds
  maxConnRetry: 5
  enableMouse: true
  headless: false
  logoless: false
  crumbsless: false
  readOnly: false            # Set true for prod clusters you shouldn't touch
  noExitOnCtrlC: false
  ui:
    enableCrumbs: true
    defaultsToFullScreen: false
    reactive: true

  # Start in this namespace by default
  currentContext: minikube
  currentCluster: minikube

  clusters:
    minikube:
      namespace:
        active: devops-exam
        favorites:
          - devops-exam
          - argocd
          - kube-system
      view:
        active: pod           # Open k9s on the pods view
      featureGates:
        nodeShell: false

  # Threshold colours for CPU/Memory
  thresholds:
    cpu:
      critical: 90
      warn: 70
    memory:
      critical: 90
      warn: 70
