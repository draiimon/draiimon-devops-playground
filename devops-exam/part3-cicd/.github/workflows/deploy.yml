name: CI/CD Pipeline — 2026

# ============================================================
# Triggers: push to 'staging', or manual run
# ============================================================
on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: false
        default: "Manual trigger"

permissions:
  contents: read
  packages: write
  id-token: write      # Required for OIDC keyless signing with Cosign
  security-events: write

env:
  REGISTRY: docker.io
  API_IMAGE: ${{ secrets.DOCKER_USERNAME }}/api-app
  UI_IMAGE:  ${{ secrets.DOCKER_USERNAME }}/ui-app

jobs:
  # ============================================================
  # JOB 1 — Build, push, sign, and generate SBOM
  # ============================================================
  build:
    name: Build & Push (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            context: ./part2-docker/api-src
            image_var: API_IMAGE
          - app: ui
            context: ./part2-docker/ui-src
            image_var: UI_IMAGE

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Validate Dockerfile
        run: docker buildx build --check "${{ matrix.context }}"

      # Use a Docker Hub access token stored as a GitHub secret.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Generate OCI-compliant image tags and labels
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env[matrix.image_var] }}
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/staging' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.app }}-app
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Build with BuildKit cache (GitHub Actions cache backend)
      - name: Build and push ${{ matrix.app }} image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to:   type=gha,scope=${{ matrix.app }},mode=max
          provenance: true    # SLSA provenance attestation
          sbom: true          # Inline SBOM in image

      # Install Cosign for keyless signing
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # Keyless sign via OIDC — no private key stored anywhere
      - name: Sign image (keyless)
        run: |
          cosign sign --yes \
            ${{ env[matrix.image_var] }}@${{ steps.build.outputs.digest }}

      # Generate full SBOM as CycloneDX
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env[matrix.image_var] }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.app }}.json
          upload-artifact: true

  # ============================================================
  # JOB 2 — Security scan (runs in parallel with each build)
  # ============================================================
  scan:
    name: Security Scan (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            image_var: API_IMAGE
          - app: ui
            image_var: UI_IMAGE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
           image-ref: ${{ env[matrix.image_var] }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.app }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 1        # Fail on CRITICAL findings

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.app }}.sarif
          category: trivy-${{ matrix.app }}

  # ============================================================
  # JOB 3 — Test (API + UI in parallel steps)
  # ============================================================
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate API Python source
        working-directory: ./part2-docker/api-src
        run: |
          python -m compileall -q .
          grep -q "FastAPI" main.py
          grep -q "uvicorn" requirements.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: part2-docker/ui-src/package-lock.json

      - name: Lint and build UI
        working-directory: ./part2-docker/ui-src
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Run Docker Compose integration smoke test
        run: |
          docker compose -f part2-docker/docker-compose.yml up -d --build
          trap 'docker compose -f part2-docker/docker-compose.yml down -v' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/ >/dev/null \
              && curl --fail --silent http://localhost:3000/ >/dev/null \
              && curl --fail --silent http://localhost:8000/trip >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose -f part2-docker/docker-compose.yml logs
              exit 1
            fi
            sleep 5
          done

          curl --fail --silent -X POST http://localhost:8000/trip \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Smoke Test","description":"GitHub Actions integration check","joiner_total_count":1}' \
            >/dev/null

          curl --fail --silent http://localhost:8000/trip >/dev/null

  # ============================================================
  # JOB 4 — Deploy via Helm (rolling update, auto-rollback)
  # ============================================================
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, scan, test]
    environment:
      name: staging
      url: http://api.myapp.local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

       - name: Set image tag
        id: tag
         run: echo "tag=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Helm upgrade (atomic — auto-rollback on failure)
        run: |
          helm upgrade myapp ./part4-ha/helm \
            --install \
            --namespace devops-exam \
            --create-namespace \
            --set api.image.repository=${{ env.API_IMAGE }} \
            --set api.image.tag=${{ steps.tag.outputs.tag }} \
            --set ui.image.repository=${{ env.UI_IMAGE }} \
            --set ui.image.tag=${{ steps.tag.outputs.tag }} \
            --atomic \
            --timeout 5m \
            --history-max 5

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/myapp-api --namespace devops-exam --timeout=2m
          kubectl rollout status deployment/myapp-ui  --namespace devops-exam --timeout=2m

      - name: Smoke test
        run: |
          sleep 10
          kubectl run smoke-test --rm -i --restart=Never \
            --image=curlimages/curl:latest \
            --namespace devops-exam \
            -- curl -sf http://myapp-api-service/healthz || exit 1

  # ============================================================
  # JOB 5 — Notify (always runs)
  # ============================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [build, scan, test, deploy]
    if: always()

    steps:
      - name: Slack — success
        if: ${{ needs.deploy.result == 'success' }}
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ *Staging deploy succeeded*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *Deploy to staging succeeded*\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Actor:* ${{ github.actor }}\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Slack — failure
        if: ${{ needs.deploy.result != 'success' }}
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ *Staging deploy FAILED*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Deploy to staging FAILED*\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Actor:* ${{ github.actor }}\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
