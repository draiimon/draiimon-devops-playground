name: CI/CD Pipeline

# ============================================================
# Triggers: push to 'staging' branch, or manual dispatch
# ============================================================
on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: false
        default: "Manual deploy"

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  API_IMAGE: ${{ secrets.DOCKER_USERNAME }}/api-app
  UI_IMAGE:  ${{ secrets.DOCKER_USERNAME }}/ui-app

jobs:
  # ============================================================
  # JOB 1 – Build Docker images and push to Docker Hub
  # ============================================================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Generate a short commit SHA tag
      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build & push API image
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./part2-docker/api
          file:    ./part2-docker/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # Build & push UI image
      - name: Build and push UI image
        uses: docker/build-push-action@v5
        with:
          context: ./part2-docker/ui
          file:    ./part2-docker/ui/Dockerfile
          push: true
          tags: |
            ${{ env.UI_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.UI_IMAGE }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ============================================================
  # JOB 2 – Test (runs in parallel with nothing; gated on build)
  # ============================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- API Tests (FastAPI / pytest) ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install API dependencies
        working-directory: ./part2-docker/api
        run: pip install -r requirements.txt pytest httpx

      - name: Run API tests
        working-directory: ./part2-docker/api
        run: pytest tests/ -v --tb=short
        continue-on-error: false

      # --- API Linting ---
      - name: Lint API (flake8)
        working-directory: ./part2-docker/api
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --exclude=__pycache__,venv,.venv

      # --- UI Tests (Next.js / Jest) ---
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: part2-docker/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ./part2-docker/ui
        run: npm ci

      - name: Run UI tests
        working-directory: ./part2-docker/ui
        run: npm test -- --passWithNoTests

      # --- UI Linting ---
      - name: Lint UI (ESLint)
        working-directory: ./part2-docker/ui
        run: npm run lint

      # --- Docker image security scan ---
      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.API_IMAGE }}:${{ needs.build.outputs.image_tag }}
          format: table
          exit-code: 0          # warn only; set to 1 to fail on CRITICAL findings
          severity: CRITICAL,HIGH

      - name: Scan UI image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.UI_IMAGE }}:${{ needs.build.outputs.image_tag }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  # ============================================================
  # JOB 3 – Deploy to staging server
  # ============================================================
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, test]
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            echo "=== Deploying tag: ${{ needs.build.outputs.image_tag }} ==="

            # Pull latest images
            docker pull ${{ env.API_IMAGE }}:${{ needs.build.outputs.image_tag }}
            docker pull ${{ env.UI_IMAGE }}:${{ needs.build.outputs.image_tag }}

            # Update compose env and do a rolling restart
            cd ~/devops-app
            export API_TAG="${{ needs.build.outputs.image_tag }}"
            export UI_TAG="${{ needs.build.outputs.image_tag }}"

            docker-compose pull
            docker-compose up -d --no-deps --build api
            docker-compose up -d --no-deps --build ui

            # Quick smoke test
            sleep 10
            curl -sf http://localhost:8000/healthz || (echo "API health check failed"; exit 1)
            curl -sf http://localhost:3000/         || (echo "UI health check failed";  exit 1)

            echo "=== Deploy succeeded ==="

  # ============================================================
  # JOB 4 – Notify on success or failure
  # ============================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [build, test, deploy]
    if: always()   # run even if previous jobs failed

    steps:
      - name: Notify Slack – Success
        if: ${{ needs.deploy.result == 'success' }}
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ *Staging deploy succeeded*\nBranch: `${{ github.ref_name }}`\nCommit: `${{ github.sha }}`\nTriggered by: ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack – Failure
        if: ${{ needs.deploy.result != 'success' }}
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ *Staging deploy FAILED*\nBranch: `${{ github.ref_name }}`\nCommit: `${{ github.sha }}`\nTriggered by: ${{ github.actor }}\nCheck logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
