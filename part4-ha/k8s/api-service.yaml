apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: devops-exam
  labels:
    app: api-app
spec:
  type: ClusterIP          # Internal only; Ingress handles external traffic
  selector:
    app: api-app           # Routes to pods with this label
  ports:
    - name: http
      protocol: TCP
      port: 80             # Service port (inside cluster)
      targetPort: 8000     # Pod's actual port
