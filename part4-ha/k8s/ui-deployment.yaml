apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-app
  namespace: devops-exam
  labels:
    app: ui-app
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ui-app
        tier: frontend
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: ui-app

      containers:
        - name: ui
          image: draiimon112/devops-ui:staging    # Replace DOCKER_USERNAME
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http

          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

      restartPolicy: Always
