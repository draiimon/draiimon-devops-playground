# ============================================================
# hpa.yaml – Horizontal Pod Autoscaler
# Automatically scales pods based on CPU usage.
# Requires: metrics-server installed in the cluster.
#
# Install metrics-server (Minikube):
#   minikube addons enable metrics-server
# ============================================================

# API autoscaler: 2–6 replicas
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: devops-exam
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-app
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # Scale out when average CPU > 70%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---

# UI autoscaler: 2–4 replicas
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ui-hpa
  namespace: devops-exam
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ui-app
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
