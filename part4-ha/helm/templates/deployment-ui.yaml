apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myapp.fullname" . }}-ui
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      {{- include "myapp.selectorLabels" (dict "component" "ui" "root" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "myapp.selectorLabels" (dict "component" "ui" "root" .) | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.ui.env | toJson | sha256sum }}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "myapp.selectorLabels" (dict "component" "ui" "root" .) | nindent 14 }}
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.service.targetPort }}
          env:
            {{- range $k, $v := .Values.ui.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.ui.probes.liveness.path }}
              port: {{ .Values.ui.service.targetPort }}
            initialDelaySeconds: {{ .Values.ui.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.ui.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.ui.probes.readiness.path }}
              port: {{ .Values.ui.service.targetPort }}
            initialDelaySeconds: {{ .Values.ui.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.ui.probes.readiness.periodSeconds }}
